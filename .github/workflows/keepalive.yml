name: Keepalive

# Free Supabase projects pause after a week without activity. Once a day this
# calls `public.keepalive()` (a `select true` only anon may execute) on the
# wiki dev and prod projects with their publishable keys. Those keys and URLs
# are public, so they are plain repository variables, not secrets: scheduled
# runs start from `dev` and cannot read the `main`-only Production
# Environment. A project whose URL variable is empty is skipped, which keeps
# prod off until its first release has applied the migration.
on:
  schedule:
    - cron: "17 3 * * *" # 12:17 KST, off the top of the hour
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: dev
            url: ${{ vars.KEEPALIVE_DEV_URL }}
            key: ${{ vars.KEEPALIVE_DEV_KEY }}
          - project: prod
            url: ${{ vars.KEEPALIVE_PROD_URL }}
            key: ${{ vars.KEEPALIVE_PROD_KEY }}
    name: ping (${{ matrix.project }})
    steps:
      - name: Call keepalive()
        env:
          PROJECT: ${{ matrix.project }}
          SUPABASE_URL: ${{ matrix.url }}
          SUPABASE_KEY: ${{ matrix.key }}
        run: |
          if [[ -z "$SUPABASE_URL" ]]; then
            echo "Skipping $PROJECT: KEEPALIVE_${PROJECT^^}_URL is not set." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$SUPABASE_KEY" ]]; then
            echo "::error::KEEPALIVE_${PROJECT^^}_KEY is not set."
            exit 1
          fi
          body="$(curl -sS --fail-with-body --retry 3 --retry-all-errors --max-time 30 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "content-type: application/json" \
            -d '{}')"
          if [[ "$body" != "true" ]]; then
            echo "::error::Unexpected response from $PROJECT: $body"
            exit 1
          fi
          echo "$PROJECT is awake." >> "$GITHUB_STEP_SUMMARY"
