name: CI

# One Supabase stack per run (starting it is the slowest step), and
# documentation-only PRs are skipped. Fork PRs run with a read-only token and no
# secrets; this workflow needs none.
#
# Pushes are not listed: `release.yml` (`main`) and `deploy-dev.yml` (`dev`) run
# this workflow through `workflow_call` before they deploy, so a merge is
# checked exactly once and no deployment can start without it.
on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_call:
  workflow_dispatch:

# PR runs cancel each other; runs for a deployment never cancel halfway.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # oxlint, tsc, Vitest, then the production build. No database needed.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Check formatting
        run: pnpm format:check

      - name: Verify
        run: pnpm verify

  # The merge ref's first parent is the base branch head. The script uses only
  # Node built-ins, so the runner's Node is enough and nothing is installed.
  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check migration order
        run: node scripts/check-migration-order.mjs HEAD^1 HEAD

  # Database checks and E2E share one local Supabase stack: starting it is the
  # slowest step, so it runs once.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The stack's ports (547xx) sit inside Linux's ephemeral range, so an
      # outgoing connection can take one and a container then fails to bind
      # it. Reserving only affects later connections, so this runs before setup.
      - name: Reserve Supabase ports
        run: |
          ports="$(sed -nE 's/^[[:space:]]*[a-z_]*port[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' supabase/config.toml \
            | sort -un | paste -sd, - || true)"
          if [[ -z "$ports" ]]; then
            echo "::error file=supabase/config.toml::No ports found to reserve."
            exit 1
          fi
          current="$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${current:+$current,}$ports"

      - uses: ./.github/actions/setup

      # A fresh runner has no volume, so `start` applies every migration and
      # the seed. Services the app and tests never touch are left out. A port
      # held by a connection from before this job can still clash: log who
      # holds 547xx and retry once (images are already pulled by then).
      #
      # Starting takes about a minute, mostly pulling images. It runs in the
      # background while Playwright installs (its `--with-deps` apt step can
      # take minutes on a slow mirror), and "Wait for Supabase" joins it.
      - name: Start Supabase
        env:
          EXCLUDE: studio,edge-runtime,imgproxy,mailpit,logflare,vector,realtime,supavisor
        run: |
          nohup bash -c '
            pnpm exec supabase start -x "$EXCLUDE" && { echo 0 > "$RUNNER_TEMP/supabase-start.exit"; exit 0; }
            echo "::warning::supabase start failed. Sockets on 547xx:"
            sudo ss -tanp | grep -E ":547[0-9]{2}\b" || true
            pnpm exec supabase stop --no-backup || true
            pnpm exec supabase start -x "$EXCLUDE"
            echo $? > "$RUNNER_TEMP/supabase-start.exit"
          ' > "$RUNNER_TEMP/supabase-start.log" 2>&1 &

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ steps.playwright-cache.outputs.cache-hit == 'true' && '--only-shell' || '' }} chromium

      - name: Wait for Supabase
        timeout-minutes: 10
        run: |
          until [[ -f "$RUNNER_TEMP/supabase-start.exit" ]]; do sleep 2; done
          cat "$RUNNER_TEMP/supabase-start.log"
          exit "$(cat "$RUNNER_TEMP/supabase-start.exit")"

      - name: Test database (pgTAP)
        run: pnpm test:db

      - name: Lint database
        run: pnpm db:lint

      - name: Check database security advisors
        run: pnpm db:advisors

      # Builds migrations and supabase/schemas in shadow databases and fails
      # when they differ. The running stack is not touched.
      - name: Check schema drift
        run: pnpm db:drift

      - name: Check generated database types
        run: |
          pnpm db:types
          if ! git diff --exit-code -- app/shared/supabase/database.types.ts; then
            echo "::error file=app/shared/supabase/database.types.ts::Generated types are stale. Run \`pnpm db:types\` and commit the result."
            exit 1
          fi

      # Read the URL and key back from the running stack instead of hardcoding
      # them, so a port change in supabase/config.toml cannot desync CI.
      - name: Export Supabase env
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "VITE_DEV_LOGIN=1"
          } >> "$GITHUB_ENV"

      # playwright.config.ts builds and serves the production output under CI.
      - name: Run E2E
        run: pnpm e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
