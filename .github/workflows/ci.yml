name: CI

# One Supabase stack per run (starting it is the slowest step), and
# documentation-only changes are skipped. Fork PRs run with a read-only token
# and no secrets; this workflow needs none.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # oxlint, tsc, Vitest, then the production build. No database needed.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Check formatting
        run: pnpm format:check

      - name: Verify
        run: pnpm verify

  # Database checks and E2E share one local Supabase stack: starting it is the
  # slowest step, so it runs once.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # The stack's ports (547xx) sit inside Linux's ephemeral range. While
      # `supabase start` pulls images in parallel, an outgoing connection can
      # take one as its source port and a container then fails to bind it.
      # Reserving them removes them from the ephemeral pool.
      - name: Reserve Supabase ports
        run: |
          ports="$(sed -nE 's/^[[:space:]]*[a-z_]*port[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' supabase/config.toml \
            | sort -un | paste -sd, - || true)"
          if [[ -z "$ports" ]]; then
            echo "::error file=supabase/config.toml::No ports found to reserve."
            exit 1
          fi
          current="$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${current:+$current,}$ports"

      # A fresh runner has no volume, so `start` applies every migration and
      # the seed. Services the app and tests never touch are left out.
      - name: Start Supabase
        run: pnpm exec supabase start -x studio,edge-runtime,imgproxy,mailpit,logflare,vector,realtime,supavisor

      - name: Test database (pgTAP)
        run: pnpm test:db

      - name: Lint database
        run: pnpm db:lint

      - name: Check database security advisors
        run: pnpm db:advisors

      - name: Check generated database types
        run: |
          pnpm db:types
          if ! git diff --exit-code -- app/shared/supabase/database.types.ts; then
            echo "::error file=app/shared/supabase/database.types.ts::Generated types are stale. Run \`pnpm db:types\` and commit the result."
            exit 1
          fi

      # Read the URL and key back from the running stack instead of hardcoding
      # them, so a port change in supabase/config.toml cannot desync CI.
      - name: Export Supabase env
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "VITE_DEV_LOGIN=1"
          } >> "$GITHUB_ENV"

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps ${{ steps.playwright-cache.outputs.cache-hit == 'true' && '--only-shell' || '' }} chromium

      # playwright.config.ts builds and serves the production output under CI.
      - name: Run E2E
        run: pnpm e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
