name: Agent rules size

# Each AGENTS.md (agent rules) must stay within 200 lines, so rules get
# removed or moved to docs/ instead of piling up (docs/adr/0001). `ci.yml`
# skips Markdown-only PRs, so this check runs on its own.
#
# It only counts lines in the checked-out files. It runs no PR code and uses no
# secrets, so fork PRs are safe.
on:
  pull_request:
    paths: ["**/AGENTS.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  line-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check AGENTS.md line counts
        run: |
          limit=200
          status=0
          # Installed agent skills (`.agents/`) are third-party files.
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            echo "$file: $lines lines"
            if (( lines > limit )); then
              echo "::error file=$file::$file has $lines lines (limit $limit). Remove stale rules or move explanations to docs/ before adding more."
              status=1
            fi
          done < <(git ls-files -- '*AGENTS.md' ':!:.agents/**')
          exit $status
