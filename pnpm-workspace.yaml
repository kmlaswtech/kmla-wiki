onlyBuiltDependencies:
  - esbuild
  - supabase

overrides:
  # GHSA-g3hv-75wg-m249: minimatch < 11.0.1. shadcn 4.23 pins ts-morph 26, whose
  # @ts-morph/common 0.27 asks for minimatch ^10; it only calls
  # `minimatch(path, pattern)`, and @ts-morph/common 0.29 already uses ^11.
  # Scoped to 0.27 so it stops applying by itself once shadcn moves on; the
  # line is then dead and can be deleted.
  "@ts-morph/common@0.27>minimatch": ^11.0.1
